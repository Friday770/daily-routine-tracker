# nginx 反向代理（可选）：用 80/443 端口、域名和 HTTPS 访问
# 使用前：.env 里设置 HOST=127.0.0.1，只让 nginx 访问后端
# 安装：sudo cp deploy/nginx.conf /etc/nginx/conf.d/daily-routine.conf && sudo nginx -t && sudo systemctl reload nginx
# HTTPS：sudo certbot --nginx -d 你的域名

server {
    listen 80;
    server_name your.domain.com;   # 改成你的域名或服务器 IP

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 实时同步（服务器推送）：必须关闭缓冲，并允许长连接
    location /api/events {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
