<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="作息">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<title>作息打卡</title>
<style>
:root{
  --study:#3d6be0; --plan:#6f7b8c; --rest:#2f9e7a; --meal:#e05a4f; --fun:#e8902a; --life:#8a6be0; --sleep:#5560c4;
  --c:var(--study);
  --bg:#f6f2eb; --card:#fffdfa; --ink:#25211c; --sub:#6e675e; --mute:#a39b90; --line:#ece6dc;
  --soft:color-mix(in srgb,var(--c) 12%,#fff);
  --shadow:0 1px 2px rgba(70,50,20,.04),0 12px 32px rgba(70,50,20,.07);
}
*{box-sizing:border-box;margin:0}
*,*:focus,*:focus-visible,*:active{outline:none!important}
.list,.sheet,.app{scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
:root{--k:1;--u:1px;--tw:calc(100vw - 92px)}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.tint{position:fixed;inset:0 0 auto;height:360px;z-index:0;pointer-events:none;transition:background .8s;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,var(--bg)),var(--bg))}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 18px)}
.spacer{flex:1;min-height:12px}
button{user-select:none;-webkit-user-select:none;touch-action:manipulation}

/* 顶栏 */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.date{font-size:15px;color:var(--sub);display:flex;align-items:center;gap:8px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--x,var(--c)) 13%,#fff);color:color-mix(in srgb,var(--x,var(--c)) 85%,#000)}
.clock{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);
  background:var(--card);padding:6px 12px;border-radius:12px;box-shadow:var(--shadow)}

/* 主卡 */
.hero{background:var(--card);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;overflow:clip}
.hero-top{overflow:hidden;overflow:clip}
.hero-top{padding:26px 26px 24px;background:var(--soft);transition:background .8s;position:relative}
.hero-top:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:color-mix(in srgb,var(--c) 14%,transparent);transition:background .8s}
.eyebrow{font-size:14px;color:var(--sub);letter-spacing:2px}
.task{font-size:38px;font-weight:700;line-height:1.25;margin:10px 0 14px;position:relative;z-index:1;word-break:keep-all}
.hero-bot{padding:22px 26px 24px}
.nums{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.nums .k{font-size:13px;color:var(--mute);margin-bottom:4px}
.left{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--c);line-height:1;letter-spacing:-1px}
.left small{font-size:16px;font-weight:600;margin-left:3px;letter-spacing:0}
.end{text-align:right}
.end b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.end span{font-size:12px;color:var(--mute);margin-left:4px}
.prog{height:10px;border-radius:10px;background:var(--line);margin:20px 0 8px;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:10px;background:var(--c);transition:width .8s,background .8s}
.pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

/* 下一项 */
.sec{font-size:13px;color:var(--mute);margin:24px 4px 10px;display:flex;justify-content:space-between}
.next{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.dot{width:40px;height:40px;border-radius:12px;flex:none;background:color-mix(in srgb,var(--x) 14%,#fff);display:grid;place-items:center}
.dot:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--x)}
.next .n{font-size:17px;font-weight:600}
.next .s{font-size:13px;color:var(--mute);margin-top:3px}
.next .t{margin-left:auto;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}

/* 今日 */
.strip{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.bars{display:flex;height:14px;gap:2px;border-radius:7px;overflow:hidden}
.bars i{background:var(--x);opacity:.22}
.bars i.done{background:#d5cfc4;opacity:1}.bars i.on{opacity:1}
.smeta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:8px}

.open{margin-top:22px;width:100%;padding:17px;border:0;border-radius:18px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;
  display:flex;justify-content:center;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(37,33,28,.18);transition:transform .15s}
.open:active{transform:scale(.98)}
.open{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:14px}

/* 居中弹框 */
:root{--mh:min(78dvh,720px)}
.mask{position:fixed;inset:0;background:rgba(40,30,20,.35);opacity:0;pointer-events:none;transition:.25s;z-index:10;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:fixed;left:50%;top:50%;width:min(560px,calc(100vw - 28px));height:var(--mh);background:var(--bg);border-radius:26px;
  z-index:11;opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.95);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(50,35,15,.28)}
.show .mask{opacity:1;pointer-events:auto}
.show .sheet{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}
.sh-head h2{font-size:21px}
.x{border:0;background:var(--card);width:34px;height:34px;border-radius:50%;font-size:16px;color:var(--sub);box-shadow:var(--shadow)}
.tabs{display:flex;margin:4px 20px 12px;background:#ebe5da;border-radius:14px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:11px;color:var(--sub);font-size:15px}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(70,50,20,.08)}
.sum{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.list{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 20px 30px}
body.lock{overflow:hidden;position:fixed;width:100%}
.sh-head h2{flex:1}
.x{width:40px;height:40px}

/* 小屏手机（iPhone SE / mini 等） */
@media (max-width:360px),(max-height:700px){
  .top{margin-bottom:14px}
  .hero-top{padding:20px 20px 18px}.hero-bot{padding:16px 20px 18px}
  .task{margin:6px 0 10px}
  .left{font-size:36px}.end b{font-size:22px}
  .prog{margin:14px 0 6px}
  .sec{margin:16px 4px 8px}
  .next{padding:12px 14px}.dot{width:34px;height:34px}
  .strip{padding:12px 14px}
  .open{margin-top:14px;padding:15px}
}
@media (max-height:620px){.foot{display:none}}
.row{display:flex;gap:12px;align-items:stretch;padding:4px 0}
.row .tm{width:46px;flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--sub);padding-top:15px;font-weight:600}
.row .card{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(70,50,20,.05)}
.row .card{gap:12px;padding:12px 14px 12px 16px}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.pill{flex:none;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,var(--x) 13%,#fff);color:color-mix(in srgb,var(--x) 80%,#000)}
.pill.p-future{background:#fff;color:var(--study);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--study) 30%,#fff)}
.row.free .pill.p-future{color:var(--rest);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rest) 30%,#fff)}
.pill.p-on{background:var(--x);color:#fff}
.row.free .pill.p-on{background:#8f877b}
.pill.p-up{background:var(--study);color:#fff}
.pill.p-done{background:#e2ddd3;color:var(--sub)}
.pill.p-skipped{background:#e2ddd3;color:var(--sub)}
.pill.p-partial{background:#fbe0bd;color:#a45f0b}
.pill.p-missed{background:#f9d3ce;color:var(--red)}
.pill.p-pending{background:#f7e3b0;color:#8a5d06}
.pill.p-rest{background:transparent;color:var(--mute);padding-right:2px}
.row .du{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.row.past{--x:#bdb6aa!important}
.row.past .card{background:#ebe7df;box-shadow:none}
.row.past .nm{color:#a39b90;font-weight:500}
.row.past .tm,.row.past .du{color:#b3ab9f}
.row.on .card{background:color-mix(in srgb,var(--x) 12%,#fff);box-shadow:0 0 0 1.5px var(--x),0 8px 20px color-mix(in srgb,var(--x) 18%,transparent)}
.row.up .card{box-shadow:0 0 0 1.5px var(--x)}
.gap{margin:2px 0 2px 58px;font-size:12px;color:var(--mute);padding:4px 10px;border-left:2px dashed #ddd5c8}

/* 手机横屏：左右两栏，内容压缩，按钮不再遮挡 */
@media (max-height:520px) and (min-width:600px){
  :root{--mh:90dvh}
  .app{max-width:none;display:grid;grid-template-columns:1.15fr 1fr;column-gap:16px;align-content:start;align-items:start;min-height:0;
    padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
  .top{grid-column:1/-1;margin-bottom:10px}
  .hero{grid-column:1;grid-row:2/9;border-radius:22px}
  .hero-top{padding:16px 20px 14px}.task{margin:4px 0 8px}
  .hero-bot{padding:14px 20px 16px}.left{font-size:34px}.end b{font-size:22px}.prog{margin:12px 0 6px}
  .sec,.next,.strip,.open,.foot{grid-column:2}
  .sec{margin:0 4px 6px}.next{padding:10px 14px;margin-bottom:10px}.strip{padding:10px 14px}
  .spacer,.foot{display:none}
  .open{position:static;margin-top:12px;padding:13px}
  .sheet{width:min(640px,calc(100vw - 28px))}
  .sh-head{padding:10px 18px 6px}.sh-head h2{font-size:18px}.x{width:34px;height:34px}
  .tabs{margin:0 18px 8px}.tabs button{padding:6px}.sum{display:none}
  .list{padding:2px 18px 14px}
}

/* 电脑 / 平板宽屏：左右两栏，整体放大 */
@media (min-width:900px){
  :root{--u:clamp(.85px,min(100vw / 1800,100vh / 1150),1.1px);--k:1.25;--tw:calc(520 * var(--u));--mh:min(84dvh,calc(820 * var(--u)))}
  .app{max-width:calc(1120 * var(--u));display:grid;grid-template-columns:1.2fr 1fr;column-gap:calc(32 * var(--u));align-content:center;align-items:start;padding-top:calc(40 * var(--u));padding-bottom:calc(40 * var(--u))}
  .top{grid-column:1/-1;margin-bottom:calc(28 * var(--u))}
  .date{font-size:calc(17 * var(--u))}.clock{font-size:calc(18 * var(--u));padding:calc(8 * var(--u)) calc(16 * var(--u))}
  .hero{grid-column:1;grid-row:2/9;border-radius:calc(34 * var(--u))}
  .hero-top{padding:calc(44 * var(--u)) calc(44 * var(--u)) calc(38 * var(--u))}
  .hero-top:after{width:calc(260 * var(--u));height:calc(260 * var(--u));right:calc(-70 * var(--u));top:calc(-70 * var(--u))}
  .eyebrow{font-size:calc(17 * var(--u))}
  .chip{font-size:calc(14 * var(--u));padding:calc(5 * var(--u)) calc(13 * var(--u))}
  .hero-bot{padding:calc(34 * var(--u)) calc(44 * var(--u)) calc(38 * var(--u))}
  .nums .k{font-size:calc(15 * var(--u))}
  .left{font-size:calc(62 * var(--u))}.left small{font-size:calc(24 * var(--u))}
  .end b{font-size:calc(42 * var(--u))}.end span{font-size:calc(15 * var(--u))}
  .prog{height:calc(14 * var(--u));margin:calc(32 * var(--u)) 0 calc(10 * var(--u))}.pmeta{font-size:calc(14 * var(--u))}
  .sec{grid-column:2;margin:0 calc(4 * var(--u)) calc(12 * var(--u));font-size:calc(15 * var(--u))}
  .sec+.next{margin-bottom:calc(28 * var(--u))}
  .next,.strip,.open,.foot{grid-column:2}
  .next{padding:calc(22 * var(--u)) calc(24 * var(--u));border-radius:calc(24 * var(--u))}.next .n{font-size:calc(22 * var(--u))}.next .s{font-size:calc(15 * var(--u))}.next .t{font-size:calc(26 * var(--u))}
  .dot{width:calc(52 * var(--u));height:calc(52 * var(--u));border-radius:calc(16 * var(--u))}.dot:after{width:calc(16 * var(--u));height:calc(16 * var(--u))}
  .strip{padding:calc(22 * var(--u)) calc(24 * var(--u));border-radius:calc(24 * var(--u));margin-bottom:0}.bars{height:calc(20 * var(--u));border-radius:calc(10 * var(--u))}.smeta{font-size:calc(14 * var(--u));margin-top:calc(12 * var(--u))}
  .spacer{display:none}
  .open{margin-top:calc(30 * var(--u));padding:calc(20 * var(--u));font-size:calc(18 * var(--u));border-radius:calc(20 * var(--u));position:static;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .open:hover{transform:translateY(calc(-2 * var(--u)));box-shadow:0 calc(14 * var(--u)) calc(30 * var(--u)) rgba(37,33,28,.24)}
  .foot{font-size:calc(13 * var(--u));margin-top:calc(16 * var(--u))}
  /* 弹框更宽更大 */
  .sheet{width:min(calc(820 * var(--u)),calc(100vw - calc(80 * var(--u))))}
  .sh-head{padding:calc(26 * var(--u)) calc(32 * var(--u)) calc(14 * var(--u))}.sh-head h2{font-size:calc(26 * var(--u))}
  .x{width:calc(42 * var(--u));height:calc(42 * var(--u));cursor:pointer}
  .tabs{margin:calc(6 * var(--u)) calc(32 * var(--u)) calc(16 * var(--u))}.tabs button{padding:calc(12 * var(--u));font-size:calc(16 * var(--u));cursor:pointer}
  .sum{padding:0 calc(32 * var(--u)) calc(16 * var(--u))}
  .list{padding:calc(4 * var(--u)) calc(32 * var(--u)) calc(36 * var(--u))}
  .row .tm{width:calc(64 * var(--u));font-size:calc(15 * var(--u));padding-top:calc(19 * var(--u))}
  .row .card{padding:calc(16 * var(--u)) calc(20 * var(--u));border-radius:calc(18 * var(--u))}
  .row .nm{font-size:calc(18 * var(--u))}.row .sub{font-size:calc(14 * var(--u))}.pill{font-size:calc(13 * var(--u));padding:calc(6 * var(--u)) calc(13 * var(--u))}
  .gap{margin-left:calc(76 * var(--u));font-size:calc(13 * var(--u))}
}

/* ================= 打卡相关新增样式 ================= */
:root{--red:#d9483b;--red-soft:#fdecea;--orange:#e08a1e;--orange-soft:#fdf1e1;--grey:#bdb6aa;--grey-soft:#ebe7df}

/* 主卡里的操作区 */
.acts{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--ink);color:#fff;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.c{background:var(--c);color:#fff}
.btn.ghost{background:color-mix(in srgb,var(--c) 12%,#fff);color:color-mix(in srgb,var(--c) 85%,#000)}
.btn.plain{background:var(--grey-soft);color:var(--sub)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn[disabled]{opacity:.5;pointer-events:none}
.acts .btn{flex:1;min-width:0;white-space:nowrap}
.acts .btn.plain{flex:0 0 auto}
.state{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;flex:1}
.state i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--grey-soft);color:var(--sub);font-size:14px}
.state.done i{background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c)}
.state.partial i{background:var(--orange-soft);color:var(--orange)}
.timer{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.timer .dotlive{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.timer .tt{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.timer .tn{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 今日进度：按状态上色 */
.bars i.st-done{background:var(--grey);opacity:1}
.bars i.st-skipped{background:#d9d3c8;opacity:1}
.bars i.st-partial{background:var(--orange);opacity:.85}
.bars i.st-missed{background:var(--red);opacity:.85}
.missed-link{color:var(--red);font-weight:600;cursor:pointer;text-decoration:none}

/* 底部两个按钮 */
.btns{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5}
.btns .open{margin-top:0;position:static;flex:1 1 auto;width:auto;min-width:0}
.btns .open.alt{flex:0 0 auto;padding-left:22px;padding-right:22px;background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* 完整作息表：日期切换 */
.dnav{display:flex;align-items:center;gap:8px;margin:4px 20px 10px}
.dnav button{border:0;width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:18px;color:var(--sub)}
.dnav button[disabled]{opacity:.35}
.dnav .dl{flex:1;text-align:center;font-weight:600;font-size:16px}
.dnav .dl small{display:block;font-weight:400;font-size:12px;color:var(--mute);margin-top:2px}
.sum .chip.red{--x:var(--red)}
.empty{padding:40px 0;text-align:center;color:var(--mute);font-size:14px}

/* 行：按打卡状态 */
.row{cursor:pointer}
.row .card{transition:transform .12s}
.row:active .card{transform:scale(.99)}
.row .tag{font-size:11px;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px;font-weight:600;white-space:nowrap}
.row.st-done{--x:var(--grey)!important}
.row.st-done .card{background:var(--grey-soft);box-shadow:none}
.row.st-done .nm{color:var(--sub);font-weight:500}
.row.st-done .tm,.row.st-done .du{color:#b3ab9f}
.row.st-skipped{--x:var(--grey)!important}
.row.st-skipped .card{background:var(--grey-soft);box-shadow:none}
.row.st-skipped .nm{color:var(--mute);font-weight:500;text-decoration:line-through}
.row.st-skipped .tm,.row.st-skipped .du{color:#b3ab9f}
.row.st-skipped .tag{background:#e0dad0;color:var(--sub)}
.row.st-partial{--x:var(--orange)!important}
.row.st-partial .card{background:var(--orange-soft);box-shadow:none}
.row.st-partial .tag{background:#fbe0bd;color:#a45f0b}
.row.st-missed{--x:var(--red)!important}
.row.st-missed .card{background:var(--red-soft);box-shadow:0 0 0 1px #f5c9c3}
.row.st-missed .tm{color:var(--red)}
.row.st-missed .tag{background:#f9d3ce;color:var(--red)}
.row .mk{background:#efe9de;color:var(--sub)}
.row.st-done .mk{background:#e0dad0}

/* 待打卡（刚结束，还在正常打卡时间内）：琥珀色 */
:root{--amber:#c98a12;--amber-soft:#fdf4dc}
.row.st-pending{--x:var(--amber)!important}
.row.st-pending .card{background:var(--amber-soft);box-shadow:0 0 0 1px #f3dfa8}
.row.st-pending .tm{color:var(--amber)}
.row.st-pending .tag{background:#f7e3b0;color:#8a5d06}
.bars i.st-pending{background:var(--amber);opacity:.9}
.pend-link{color:var(--amber)!important}
.pend{flex-basis:100%;border-radius:16px;padding:12px 14px;background:var(--amber-soft);border:1px solid #f3dfa8}
.pend.missed{background:var(--red-soft);border-color:#f5c9c3}
.pend .pt{font-size:14px;color:var(--sub);margin-bottom:10px;line-height:1.5}
.pend .pt b{color:var(--ink)}
.pend .more{margin-left:8px;color:var(--amber);font-weight:600;cursor:pointer;white-space:nowrap}
.pend.missed .more{color:var(--red)}
.pend .pb{display:flex;gap:8px}
.pend .pb .btn{flex:1;padding:10px 8px;font-size:14px;min-width:0}
.pend .pb .btn.c{background:var(--amber)}
.pend.missed .pb .btn.c{background:var(--red)}
.btn.early{flex-basis:100%;display:flex;justify-content:center;align-items:baseline;gap:8px}
.btn.early small{font-weight:500;opacity:.75;font-size:12px}

/* 非学习时间：不需要打卡，不变红 */
/* 还没到的项：保持亮色，只用颜色区分 学习（蓝）/ 休息等非学习（绿） */
.row.st-future .card{background:color-mix(in srgb,var(--study) 8%,#fff);box-shadow:0 0 0 1px color-mix(in srgb,var(--study) 20%,#fff)}
.row.st-future .tm{color:var(--study)}
.row.st-future .nm{color:var(--ink);font-weight:600}
.row.free{cursor:default}
.row.free .card{background:color-mix(in srgb,var(--rest) 9%,#fff);box-shadow:0 0 0 1px color-mix(in srgb,var(--rest) 20%,#fff)}
.row.free .nm{color:var(--ink);font-weight:500}
.row.free .tm{color:var(--rest)}
.row.free .du{color:var(--mute)}
/* 已经过去的非学习项：淡化 */
.row.st-rest .card{background:#f1ede6;box-shadow:none}
.row.st-rest .nm{color:var(--sub)}
.row.st-rest .card,.row.st-rest .tm{opacity:.6}
.row.st-rest .tm{color:var(--mute)}
.row.free.on .card{background:var(--card);box-shadow:0 0 0 1.5px #b9b1a4}
.row.free.on .nm{color:var(--ink);font-weight:600}
.bars i.st-rest{background:#e2ddd3;opacity:1}
.state.free{color:var(--sub);font-weight:500}

/* 打卡弹框（叠在作息表上） */
.itemWrap .mask{z-index:20}
.itemWrap .sheet{z-index:21;height:auto;max-height:min(90dvh,640px);width:min(440px,calc(100vw - 28px))}
.ibody{padding:4px 22px 22px;overflow-y:auto}
.ibody h3{font-size:22px;margin:0 0 4px}
.ibody .meta{color:var(--sub);font-size:14px}
.ibody .now{margin:14px 0 16px;padding:10px 14px;border-radius:12px;background:var(--card);font-size:14px;color:var(--sub);box-shadow:var(--shadow)}
.ibody .now b{color:var(--ink)}
.seg{display:flex;background:#ebe5da;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:11px;color:var(--sub);font-size:15px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 2px 6px rgba(70,50,20,.08)}
.fld{display:block;margin-bottom:12px;font-size:13px;color:var(--sub)}
.fld input,.fld textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.hint{font-size:13px;color:var(--orange);margin:-4px 0 12px}
.irow{display:flex;gap:10px;margin-top:6px}
.irow .btn{flex:1;padding:14px}
.lock-msg{padding:18px;border-radius:14px;background:var(--card);color:var(--sub);text-align:center;margin:12px 0}

/* 统计弹框 */
.stats{flex:1;overflow-y:auto;padding:4px 20px 26px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.tile{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--mute)}
.tile .v{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;font-weight:600;margin-left:2px;color:var(--sub)}
.tile .s{font-size:12px;color:var(--sub);margin-top:2px}
.h4{font-size:14px;font-weight:600;color:var(--sub);margin:6px 2px 10px}
.blist{background:var(--card);border-radius:16px;padding:8px 14px;box-shadow:var(--shadow);margin-bottom:18px}
.bl{display:grid;grid-template-columns:78px 1fr 52px;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.bl+.bl{border-top:1px solid var(--line)}
.bl .lb{color:var(--sub);font-variant-numeric:tabular-nums}
.bl .lb b{color:var(--ink);font-weight:600}
.bl .tr{height:10px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
.bl .tr i{display:block;height:100%;border-radius:6px;background:var(--x,var(--study))}
.bl .tr i.s2{position:absolute;left:0;top:0;opacity:.35}
.bl .vv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.bl .sub2{grid-column:2/4;font-size:11px;color:var(--mute);margin-top:-4px}
.wtab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.wtab th{font-weight:500;color:var(--mute);text-align:right;padding:8px 4px}
.wtab td{text-align:right;padding:9px 4px;border-top:1px solid var(--line)}
.wtab th:first-child,.wtab td:first-child{text-align:left}
.note2{font-size:12px;color:var(--mute);margin:-8px 2px 16px}

/* 圆形打卡按钮 */
.punch{display:flex;align-items:center;gap:18px;flex-basis:100%}
.pbtn{--b:#3d6be0;flex:none;width:92px;height:92px;border-radius:50%;border:0;color:#fff;font-size:20px;font-weight:700;letter-spacing:2px;
  background:radial-gradient(circle at 35% 30%,#6b90f0,var(--b) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 10px 24px rgba(61,107,224,.35),inset 0 -3px 0 rgba(0,0,0,.08);position:relative;transition:transform .15s,box-shadow .2s}
.pbtn:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid color-mix(in srgb,var(--b) 35%,transparent);animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}

.pbtn:active,.pbtn.hit{transform:scale(.94)}
.pbtn.late{--b:#3d6be0}
.pbtn.done{background:#fff;color:#3d6be0;font-size:34px;box-shadow:0 0 0 2px #cfdcfb,0 8px 18px rgba(61,107,224,.12)}
.pbtn.done:before,.pbtn.timer:before{display:none}
.pbtn.timer{background:#fff;color:#3d6be0;box-shadow:0 0 0 3px #3d6be0,0 8px 18px rgba(61,107,224,.18);letter-spacing:0}
.pbtn.timer .pt-time{font-size:19px;font-variant-numeric:tabular-nums}
.pbtn.timer small{font-size:10px;font-weight:500;color:var(--mute)}
.pinfo{flex:1;min-width:0}
.pinfo .pn{font-size:18px;font-weight:700;line-height:1.3}
.pinfo .ps{font-size:13px;color:var(--sub);margin-top:4px}
.pinfo .pl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
.pinfo .pl a{font-size:13px;font-weight:600;color:#3d6be0;cursor:pointer}
.pinfo .pl a.warn{color:var(--red)}
.early-link{flex-basis:100%;margin-top:4px;font-size:13px;font-weight:600;color:#3d6be0;cursor:pointer}
@media (min-width:900px){
  .punch{gap:calc(22 * var(--u))}
  .pbtn{width:calc(104 * var(--u));height:calc(104 * var(--u));font-size:calc(22 * var(--u))}
  .pinfo .pn{font-size:calc(20 * var(--u))}.pinfo .ps,.pinfo .pl a,.early-link{font-size:calc(14 * var(--u))}
}

/* 主卡打卡区：大圆按钮 */
.acts{display:block;margin-top:22px}
.punchzone{display:flex;justify-content:center;gap:22px;padding:6px 0 2px}
.pz-item{display:flex;flex-direction:column;align-items:center;min-width:0;flex:0 1 auto}
.pbig{--b:#3d6be0;width:156px;height:156px;border-radius:50%;border:0;color:#fff;position:relative;
  background:radial-gradient(circle at 34% 28%,#7a9cf3,var(--b) 68%);
  box-shadow:0 14px 32px rgba(61,107,224,.38),inset 0 -4px 0 rgba(0,0,0,.08);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 14px;
  transition:transform .15s,box-shadow .2s,opacity .2s;-webkit-touch-callout:none}
.pbig:before{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(61,107,224,.35);animation:ring 2.2s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.94);opacity:.9}100%{transform:scale(1.16);opacity:0}}
.pbig:active,.pbig.hit{transform:scale(.94)}
.pbig .pb-main{font-size:26px;font-weight:700;letter-spacing:1px;line-height:1.1;font-variant-numeric:tabular-nums}
.pbig .pb-sub{font-size:13px;opacity:.9;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbig.p-end{--b:#2f57c4}
.pbig.p-run{background:#fff;color:#1d1b18;box-shadow:0 14px 34px rgba(61,107,224,.16)}
.pbig .pr{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.pbig .pr circle{fill:none;stroke-width:7}
.pbig .pr-bg{stroke:#e9eefb}
.pbig .pr-fg{stroke:#3d6be0;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.pbig.p-run .pb-main{font-size:30px;font-weight:700;letter-spacing:0;color:#1d1b18;position:relative}
.pbig.p-run .pb-sub{color:#3d6be0!important;font-weight:600;position:relative}
.pbig.p-done{background:linear-gradient(160deg,#f6f9ff,#e8effd);color:#1d1b18;box-shadow:0 12px 30px rgba(61,107,224,.12),inset 0 0 0 1px #dde6fb;gap:6px}
.pbig .pb-ic{width:42px;height:42px;border-radius:50%;background:#3d6be0;display:grid;place-items:center;box-shadow:0 6px 14px rgba(61,107,224,.3);margin-bottom:2px}
.pbig .pb-ic svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.pbig .pb-ic.partial{background:#e08a1e;box-shadow:0 6px 14px rgba(224,138,30,.3)}
.pbig .pb-ic.skipped{background:#b9b3a8;box-shadow:none}
.pbig.p-done .pb-main{font-size:18px!important;font-weight:700;letter-spacing:1px}
.pbig.p-done .pb-sub{color:var(--sub)!important;font-size:13px}
.pbig.p-run:before,.pbig.p-done:before,.pbig.p-wait:before{display:none}

.pbig.p-wait{background:#eef2fc;color:#8aa0d6;box-shadow:inset 0 0 0 2px #d5def6}
.pz-hint{margin-top:12px;font-size:13px;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.punchzone.two .pbig{width:128px;height:128px}
.punchzone.two .pbig .pb-main{font-size:21px}
.punchzone.two .pz-hint{max-width:150px}
.pz-note{margin-top:14px;text-align:center;font-size:13px;color:var(--mute)}
.pz-miss{display:block;margin-top:14px;text-align:center;font-size:14px;font-weight:600;color:var(--red);cursor:pointer}
.row.st-ready,.row.st-running{--x:#3d6be0!important}
@media (hover:hover){.pbig:hover{transform:translateY(-2px)}.pbig.p-wait:hover{transform:none}}
@media (max-width:360px),(max-height:700px){
  .pbig{width:132px;height:132px}.pbig .pb-main{font-size:22px}
  .punchzone.two .pbig{width:112px;height:112px}.punchzone.two{gap:14px}
}
@media (max-height:520px) and (min-width:600px){.pbig{width:118px;height:118px}.pbig .pb-main{font-size:20px}}
@media (min-width:900px){
  .acts{margin-top:calc(30 * var(--u))}
  .pbig{width:calc(172 * var(--u));height:calc(172 * var(--u))}
  .pbig .pb-main{font-size:calc(28 * var(--u))}.pbig .pb-sub{font-size:calc(14 * var(--u))}
  .punchzone.two .pbig{width:calc(146 * var(--u));height:calc(146 * var(--u))}
  .pz-hint,.pz-note{font-size:calc(14 * var(--u))}.pz-miss{font-size:calc(15 * var(--u))}
}

/* 新版本提示 */
.h-update{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 1px 2px rgba(40,30,10,.04),0 12px 30px rgba(61,107,224,.12);border:1px solid #dfe7fb}
.h-update[hidden]{display:none}
.h-update .u-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.h-update .u-main b{font-size:15px;color:#3d6be0}
.h-update .u-main span{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.h-update .u-list{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--sub);line-height:1.6}
.h-update .u-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.h-update button{border:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600}
.h-update .u-later{background:#f1eee8;color:var(--sub)}
.h-update .u-go{background:#3d6be0;color:#fff}
.h-ver{margin-left:10px;opacity:.8}
@media (min-width:760px){.h-update{grid-column:1/-1}}

/* 学习趋势图 */
.chart-head{display:flex;justify-content:space-between;align-items:center}
.seg.mini{margin:0;padding:3px;border-radius:10px}
.seg.mini button{padding:5px 14px;font-size:13px;border-radius:8px}
.chartbox{padding:12px 12px 10px}
.cnav{display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:4px}
.cnav button{border:0;background:var(--grey-soft);width:28px;height:28px;border-radius:8px;color:var(--sub);font-size:15px}
.cnav button[disabled]{opacity:.3}
.combo{width:100%;height:auto;display:block}
.combo .grid{stroke:var(--line);stroke-width:1}
.combo .ax{font-size:9px;fill:var(--mute)}
.combo .xl{font-size:11px;fill:var(--sub);font-weight:600}
.combo .xs{font-size:9px;fill:var(--mute)}
.combo .bp{fill:color-mix(in srgb,var(--study) 16%,#fff)}
.combo .ba{fill:var(--study)}
.combo .ln{fill:none;stroke:var(--orange);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.combo .dt{fill:#fff;stroke:var(--orange);stroke-width:2}
.combo .hit{fill:transparent;cursor:pointer}
.combo .hit.sel{fill:color-mix(in srgb,var(--study) 7%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:11px;color:var(--sub);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .lg-plan{background:color-mix(in srgb,var(--study) 16%,#fff)}
.legend .lg-act{background:var(--study)}
.legend .lg-line{height:3px;width:14px;border-radius:2px;background:var(--orange);vertical-align:2px}
.cdetail:empty{display:none}
.cdetail{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--grey-soft);font-size:12px;color:var(--sub);text-align:center;min-height:32px}

/* 提示条 */
.toast{position:fixed;left:50%;width:max-content;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);opacity:0;z-index:40;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.offline{display:none;margin:0 0 14px;padding:10px 14px;border-radius:14px;background:var(--red-soft);color:var(--red);font-size:13px}
.offline.show{display:block}

@media (max-width:360px),(max-height:700px){
  .acts{margin-top:12px}.btn{padding:11px 14px;font-size:14px}

}

}

  .offline{grid-column:1/-1}
  .acts{margin-top:calc(26 * var(--u));gap:calc(12 * var(--u))}
  .btn{padding:calc(14 * var(--u)) calc(22 * var(--u));font-size:calc(16 * var(--u));border-radius:calc(16 * var(--u))}
  .timer .tt{font-size:calc(24 * var(--u))}
  .btns{grid-column:2;position:static;margin-top:calc(30 * var(--u));gap:calc(12 * var(--u))}
  .btns .open{margin-top:0}
  .dnav{margin:calc(4 * var(--u)) calc(32 * var(--u)) calc(14 * var(--u))}
  .dnav button{width:calc(44 * var(--u));height:calc(44 * var(--u))}
  .dnav .dl{font-size:calc(18 * var(--u))}
  .row .tag{font-size:calc(12 * var(--u))}
  .itemWrap .sheet{width:calc(480 * var(--u))}
  .stats{padding:calc(4 * var(--u)) calc(32 * var(--u)) calc(32 * var(--u))}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tile .v{font-size:calc(30 * var(--u))}
  .bl{grid-template-columns:calc(96 * var(--u)) 1fr calc(60 * var(--u));font-size:calc(14 * var(--u))}
  .wtab{font-size:calc(14 * var(--u))}
}

/* =================== 主页面（重新设计） =================== */
body{background:#f5f3ee;background-image:radial-gradient(1200px 520px at 50% -180px,#ffffff 0%,rgba(255,255,255,0) 70%)}
.home{--ink:#1d1b18;--sub:#6c675f;--mute:#a7a299;--hair:#ece8e0;--blue:#3d6be0;
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 18px);
  display:flex;flex-direction:column;gap:16px}
/* 顶栏 */
.h-top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 4px}
.h-date{font-size:22px;font-weight:700;letter-spacing:.5px;color:var(--ink)}
.h-sub{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.h-dot{width:3px;height:3px;border-radius:50%;background:var(--mute)}
.h-tools{display:flex;gap:8px}
.h-btn{display:flex;align-items:center;gap:6px;height:40px;white-space:nowrap;padding:0 14px;border:0;border-radius:999px;background:#fff;color:var(--ink);
  font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);transition:transform .15s}
.h-btn:active{transform:scale(.96)}
.h-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.h-btn svg circle{fill:currentColor;stroke:none}
/* 卡片 */
.h-focus,.h-today{background:#fff;border-radius:28px;box-shadow:0 1px 2px rgba(40,30,10,.04),0 18px 40px rgba(40,30,10,.07)}
.h-focus{padding:24px 24px 26px;overflow:hidden;overflow:clip}
.h-eyebrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.h-cat{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:#f4f2ed;color:var(--sub);font-weight:600;font-size:12px}
.h-cat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.h-title{margin:14px 0 18px;font-size:40px;line-height:1.15;font-weight:800;letter-spacing:1px;color:var(--ink);word-break:keep-all}
.h-title.lg{font-size:32px}.h-title.xl{font-size:26px}
.h-meta{display:flex;align-items:baseline;justify-content:space-between;font-variant-numeric:tabular-nums}
.h-span{font-size:15px;color:var(--sub);font-weight:500}
.h-left{font-size:13px;color:var(--mute)}
.h-left b{font-size:24px;color:var(--ink);font-weight:700;margin-left:6px;letter-spacing:.5px}
.h-prog{height:6px;border-radius:6px;background:#f0ede6;margin-top:12px;overflow:hidden}
.h-prog i{display:block;height:100%;width:0;border-radius:6px;background:var(--ink);transition:width .8s}
.h-punch{margin-top:26px;padding-top:26px;border-top:1px solid var(--hair)}
.h-punch .punchzone{padding:4px 0 0}
.h-punch .pz-hint{color:var(--mute);margin-top:14px}
.h-punch .pz-miss{display:inline-block;margin:18px auto 0;padding:7px 14px;border-radius:999px;background:#fdecea;color:#c8402f;font-size:13px}
.h-punch{text-align:center}
.h-punch .pbig.p-wait{width:124px;height:124px;background:#f3f6fd;color:#7f97d4;box-shadow:inset 0 0 0 1.5px #dce4f8}
.h-punch .pbig.p-wait .pb-main{font-size:20px}
.h-punch .pbig.p-run,.h-punch .pbig.p-done{width:150px;height:150px}
/* 今日学习 */
.h-today{padding:22px 22px 18px}
.h-thead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.h-ttl{font-size:16px;font-weight:700;color:var(--ink)}
.h-ttl2{font-size:13px;font-weight:600;color:var(--mute);margin:20px 0 6px}
.h-tsub{font-size:13px;color:var(--sub);margin-top:4px}
.h-tsub .missed-link{font-weight:600}
.h-ring{position:relative;width:84px;height:84px;flex:none}
.h-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.h-ring circle{fill:none;stroke-width:9}
.h-ring .rg-bg{stroke:#eef1fa}
.h-ring .rg-fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .8s}
.h-ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;color:var(--ink);font-variant-numeric:tabular-nums}
.h-ring b{font-size:24px;font-weight:800;letter-spacing:-.5px}
.h-ring small{font-size:12px;font-weight:700;color:var(--mute);margin-top:6px}
.h-today .bars{height:10px;border-radius:6px}
.h-today .smeta{margin-top:8px}
.h-up{display:flex;flex-direction:column}
.h-uprow{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--hair);font-size:15px}
.h-uprow:first-child{border-top:0}
.h-ut{font-variant-numeric:tabular-nums;color:var(--mute);font-size:13px;font-weight:600}
.h-un{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-ug{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#eef6f2;color:#2f8f6e}
.h-uprow.need .h-ug{background:#eef2fc;color:var(--blue)}
.h-empty{font-size:13px;color:var(--mute);padding:10px 0}
.h-foot{text-align:center;font-size:12px;color:var(--mute);margin-top:auto;padding-top:4px}
@media (hover:hover){.h-btn:hover{transform:translateY(-1px)}}
/* 小屏 iPhone */
@media (max-width:360px),(max-height:700px){
  .home{gap:12px;padding-top:calc(env(safe-area-inset-top) + 12px)}
  .h-focus{padding:20px 20px 22px}.h-title{font-size:34px;margin:10px 0 14px}.h-title.lg{font-size:28px}.h-title.xl{font-size:23px}
  .h-punch{margin-top:20px;padding-top:20px}
  .h-btn span{display:none}.h-btn{width:40px;padding:0;justify-content:center}
}
/* 手机横屏 / 平板 / 电脑：左右两栏 */
@media (min-width:760px){
  .home{max-width:none;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto auto auto auto auto;align-content:center;column-gap:20px;
    width:min(100%,960px)}
  .h-top,.offline,.h-foot{grid-column:1/-1}
  .h-top{grid-row:1}.offline{grid-row:2}.h-update{grid-row:3}.h-foot{grid-row:5;margin-top:0}
  .h-focus{grid-column:1;grid-row:4}
  .h-today{grid-column:2;grid-row:4;display:flex;flex-direction:column}
  .h-focus{display:flex;flex-direction:column}
  .h-focus .h-punch{flex:1;display:flex;flex-direction:column;justify-content:center}
}
@media (min-width:900px){
  .h-punch .pbig.p-wait{width:calc(136 * var(--u));height:calc(136 * var(--u))}
  .h-punch .pbig.p-run,.h-punch .pbig.p-done{width:calc(152 * var(--u));height:calc(152 * var(--u))}
  .home{width:min(100%,calc(1120 * var(--u)));column-gap:calc(28 * var(--u));row-gap:calc(20 * var(--u));
    padding:calc(36 * var(--u)) calc(32 * var(--u))}
  .h-date{font-size:calc(26 * var(--u))}.h-sub{font-size:calc(14 * var(--u))}
  .h-btn{height:calc(44 * var(--u));padding:0 calc(18 * var(--u));font-size:calc(15 * var(--u))}
  .h-focus{padding:calc(36 * var(--u)) calc(40 * var(--u)) calc(38 * var(--u));border-radius:calc(32 * var(--u))}
  .h-today{padding:calc(30 * var(--u)) calc(30 * var(--u)) calc(24 * var(--u));border-radius:calc(32 * var(--u))}
  .h-eyebrow{font-size:calc(14 * var(--u))}.h-cat{font-size:calc(13 * var(--u))}
  .h-title{font-size:calc(54 * var(--u));margin:calc(18 * var(--u)) 0 calc(24 * var(--u))}
  .h-title.lg{font-size:calc(44 * var(--u))}.h-title.xl{font-size:calc(36 * var(--u))}
  .h-span{font-size:calc(17 * var(--u))}.h-left{font-size:calc(14 * var(--u))}.h-left b{font-size:calc(30 * var(--u))}
  .h-prog{height:calc(7 * var(--u));margin-top:calc(16 * var(--u))}
  .h-punch{margin-top:calc(32 * var(--u));padding-top:calc(32 * var(--u))}
  .h-ttl{font-size:calc(18 * var(--u))}.h-tsub,.h-ttl2{font-size:calc(14 * var(--u))}
  .h-ring{width:calc(104 * var(--u));height:calc(104 * var(--u))}.h-ring b{font-size:calc(30 * var(--u))}.h-ring small{font-size:calc(14 * var(--u))}
  .h-uprow{font-size:calc(16 * var(--u));padding:calc(13 * var(--u)) 0;grid-template-columns:calc(70 * var(--u)) 1fr auto}
  .h-ut,.h-ug{font-size:calc(13 * var(--u))}.h-foot{font-size:calc(13 * var(--u))}
}
</style>
</head>
<body>
<main class="home">
  <header class="h-top">
    <div>
      <div class="h-date" id="date"></div>
      <div class="h-sub"><span id="kind"></span><span class="h-dot"></span><span id="clock" class="h-clock"></span></div>
    </div>
    <nav class="h-tools">
      <button class="h-btn" id="open" aria-label="完整作息表"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>作息表</span></button>
      <button class="h-btn" id="openStats" aria-label="统计"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>统计</span></button>
    </nav>
  </header>
  <div class="offline" id="offline"></div>
  <div class="h-update" id="upd" hidden></div>

  <section class="h-focus">
    <div class="h-eyebrow"><span class="h-cat" id="cat"></span><span id="label">现在</span></div>
    <h1 class="h-title" id="task">加载中…</h1>
    <div class="h-meta">
      <span class="h-span"><span id="pfrom">--</span> – <span id="pto">--</span></span>
      <span class="h-left">还剩 <b id="left">--</b></span>
    </div>
    <div class="h-prog"><i id="prog"></i></div>
    <div class="h-punch" id="acts"></div>
  </section>

  <section class="h-today">
    <div class="h-thead">
      <div><div class="h-ttl">今日学习</div><div class="h-tsub" id="done"></div></div>
      <div class="h-ring" id="ring"></div>
    </div>
    <div class="bars" id="dbar"></div>
    <div class="smeta" id="dmeta"></div>
    <div class="h-ttl h-ttl2">接下来</div>
    <div class="h-up" id="next"></div>
  </section>

  <div class="h-foot"><span id="foot">工作日作息实行一个月</span><span class="h-ver" id="ver"></span></div>
</main>

<!-- 完整作息表 -->
<div class="modal" id="listWrap">
  <div class="mask" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="完整作息表">
    <div class="sh-head"><h2>完整作息表</h2><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="dnav">
      <button id="dPrev" aria-label="前一天">‹</button>
      <div class="dl" id="dLabel"></div>
      <button id="dNext" aria-label="后一天">›</button>
    </div>
    <div class="sum" id="sum"></div>
    <div class="list" id="list"></div>
  </section>
</div>

<!-- 打卡 / 补打卡 -->
<div class="modal itemWrap" id="itemWrap">
  <div class="mask" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="打卡">
    <div class="sh-head"><h2 id="iTitle">打卡</h2><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="ibody" id="iBody"></div>
  </section>
</div>

<!-- 统计 -->
<div class="modal" id="statsWrap">
  <div class="mask" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="统计">
    <div class="sh-head"><h2>统计</h2><button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="stats" id="stats"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   基础
   ================================================================ */
const CAT={study:["科研 / 学习","--study"],plan:["计划 / 复盘","--plan"],rest:["休息","--rest"],meal:["用餐","--meal"],fun:["娱乐","--fun"],life:["起居 / 家务","--life"],sleep:["睡眠","--sleep"]};
const ST={done:"已完成",partial:"部分完成",skipped:"已跳过",missed:"未打卡",on:"进行中，还没开始学习",future:"未开始",ready:"可以开始学习",running:"学习中",pending:"等待结束打卡",rest:"非学习时间"};
const W=["日","一","二","三","四","五","六"];
const MAX_BACK=7, MAX_FWD=7;     // 可补打卡天数、向后可看天数
// 打卡时间窗口（分钟），与后端一致：开始前 1 分钟可开始学习；结束前 1 分钟到结束后 5 分钟可结束学习
const START_BEFORE=1, END_BEFORE=1, END_AFTER=5;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const m=s=>{const[h,x]=s.split(":").map(Number);return h*60+x};
const f=x=>{x=((x%1440)+1440)%1440;return pad(Math.floor(x/60))+":"+pad(Math.floor(x%60))};
const col=c=>`var(${(CAT[c]||CAT.plan)[1]})`;
const catName=c=>(CAT[c]||[c])[0];
const esc=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parseISO=s=>{const[y,mo,da]=s.split("-").map(Number);return new Date(y,mo-1,da)};
const dtStr=d=>`${iso(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
// 统一时区：页面上所有时间都按后端设置的时区（.env 里的 APP_TIMEZONE）显示和判断，
// 这样手机和电脑即使系统时区不同，看到的时间也一样。TZOFF 为该时区相对 UTC 的分钟数。
let TZOFF=null;
let nowDate=()=>TZOFF==null?new Date():new Date(Date.now()+(TZOFF+new Date().getTimezoneOffset())*60000);
const nowMins=d=>d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
const dayLabel=s=>{const d=parseISO(s);return `${d.getMonth()+1}月${d.getDate()}日 · 星期${W[d.getDay()]}`};

/* ================================================================
   接口
   ================================================================ */
// 本页面的编号：打卡时告诉后端是谁打的，收到推送时用来区分“本机”还是“另一台设备”
const CLIENT_ID=Math.random().toString(36).slice(2,10);
async function api(path,opt={}){
  let r;
  try{r=await fetch("/api"+path,{headers:{"content-type":"application/json","X-Client":CLIENT_ID},cache:"no-store",...opt})}
  catch(e){throw new Error("连不上服务器，请确认后端已启动")}
  let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error((j&&j.detail&&(typeof j.detail==="string"?j.detail:"提交的内容有误"))||`请求失败（${r.status}）`);
  return j;
}
const days={};   // 'YYYY-MM-DD' -> {date,type,editable,rows}
function toRow(it){
  const a=m(it.start_time),b=it.end_time?m(it.end_time):a;
  return {id:it.schedule_id,a,b,d:b-a,n:it.task,c:it.category,plan:it.planned_min,need:!!it.count_in_rate,
    ck:it.status?{status:it.status,actual:it.actual_min,note:it.note||"",makeup:!!it.is_makeup,started:it.started_at}:null};
}
async function loadDay(ds){
  const j=await api(`/day?date=${ds}`);
  days[ds]={date:ds,type:j.day_type,editable:j.editable,rows:j.items.map(toRow)};
  return days[ds];
}
let online=true;
function setOnline(ok,msg){
  online=ok;$("offline").textContent=msg||"";$("offline").classList.toggle("show",!ok);
}
async function loadAround(){
  const t=nowDate();
  try{
    await Promise.all([iso(addDays(t,-1)),iso(t),iso(addDays(t,1))].map(loadDay));
    setOnline(true);
  }catch(e){setOnline(false,e.message+"。下面显示的是上次读取到的数据。")}
}

/* ================================================================
   状态计算
   ================================================================ */
// 某一天某一项此刻的状态：done / partial / skipped / missed / on / future
function rowState(ds,r,d=nowDate()){
  const today=iso(d),x=nowMins(d),ck=r.ck;
  if(!r.need){                                   // 非学习时间：不需要打卡
    if(ds>today)return "future";
    if(ds<today)return "rest";
    if(x<r.a)return "future";
    if(r.d===0||x<r.b)return "on";
    return "rest";
  }
  if(ck&&ck.status!=="started")return ck.status; // 已完成 / 部分完成 / 跳过
  if(ds>today)return "future";
  if(ds<today)return "missed";
  if(x<r.a-START_BEFORE)return "future";
  if(x<r.b-END_BEFORE)return ck?"running":(x<r.a?"ready":"on");
  if(x<=r.b+END_AFTER)return "pending";            // 结束打卡时间
  return "missed";
}
// 打卡时间（开始窗口到结束窗口）是否还没过
const inLive=(ds,r,d=nowDate())=>ds===iso(d)&&nowMins(d)>=r.a-START_BEFORE&&nowMins(d)<=r.b+END_AFTER;
const afterLive=(ds,r,d=nowDate())=>ds<iso(d)||(ds===iso(d)&&nowMins(d)>r.b+END_AFTER);
const willBeMakeup=(ds,r,d=nowDate())=>(!r.ck||r.ck.status==="started")&&afterLive(ds,r,d);

// 首屏：现在处于哪一段
function state(d){
  const ds=iso(d),day=days[ds];
  if(!day)return null;
  const rows=day.rows,x=nowMins(d);
  if(!rows.length)return{ds,i:-9,name:"今天没有作息安排",c:"plan",from:0,to:1440,x,next:null};
  const first=rows[0],last=rows[rows.length-1];
  const tmrDay=days[iso(addDays(d,1))],yDay=days[iso(addDays(d,-1))];
  const tFirst=tmrDay&&tmrDay.rows[0];
  const yEnd=yDay&&yDay.rows.length?yDay.rows[yDay.rows.length-1].b:first.a-480;
  const tomorrowNext=tFirst?{n:tFirst.n,a:tFirst.a+1440,c:tFirst.c,tomorrow:true}:null;
  for(let i=0;i<rows.length;i++){const r=rows[i];
    if(r.d>0&&x>=r.a&&x<r.b)return{ds,i,r,from:r.a,to:r.b,name:r.n,c:r.c,next:rows[i+1]||tomorrowNext,x};
  }
  if(x>=last.b)return{ds,i:-2,from:last.b,to:tFirst?tFirst.a+1440:1440+480,name:"睡觉",c:"sleep",note:"今天的安排已经结束",next:tomorrowNext,x};
  if(x<first.a)return{ds,i:-1,from:yEnd-1440,to:first.a,name:"睡觉",c:"sleep",note:"还没到起床时间",next:first,x};
  for(let i=1;i<rows.length;i++){const p=rows[i-1],r=rows[i];
    if(x>=p.b&&x<r.a)return{ds,i:-3,gapAfter:i-1,from:p.b,to:r.a,name:"自由时间",c:"plan",note:"两项安排之间的空档",next:r,x};
  }
  return{ds,i:-9,name:"—",c:"plan",from:x,to:x+1,x,next:null};
}

/* ================================================================
   计时（存在本机浏览器，结束时才写入数据库）
   ================================================================ */
const TKEY="routine.timer";
function getTimer(){try{return JSON.parse(localStorage.getItem(TKEY)||"null")}catch(_){return null}}
function setTimer(t){try{t?localStorage.setItem(TKEY,JSON.stringify(t)):localStorage.removeItem(TKEY)}catch(_){}}

/* ================================================================
   首屏渲染
   ================================================================ */
function ring(n,t){
  const R=42,C=2*Math.PI*R,p=t?n/t:0;
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" class="rg-bg"/><circle cx="50" cy="50" r="${R}" class="rg-fg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}"/></svg><span><b>${Math.round(p*100)}</b><small>%</small></span>`;
}
function tick(){
  const d=nowDate(),ds=iso(d);
  $("clock").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $("date").textContent=`${d.getMonth()+1}月${d.getDate()}日`;
  const s=state(d);
  if(!s)return;
  const day=days[ds];
  document.documentElement.style.setProperty("--c",col(s.c));
  $("kind").textContent=`星期${W[d.getDay()]} · ${day.type==="end"?"周末":"工作日"}`;
  $("label").textContent=s.note||"现在";
  $("task").textContent=s.name;
  const len=[...s.name].reduce((a,ch)=>a+(/[\x00-\xff]/.test(ch)?.55:1),0);
  $("task").className="h-title"+(len>9?" xl":len>6?" lg":"");
  $("cat").innerHTML=`<i style="background:${col(s.c)}"></i>${catName(s.c)}`;
  const total=Math.max(1,s.to-s.from),left=Math.max(0,s.to-s.x),pct=Math.min(1,Math.max(0,(s.x-s.from)/total));
  const sec=Math.round(left*60),hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60),ss=sec%60;
  $("left").textContent=hh?`${hh} 小时 ${mm} 分`:`${pad(mm)}:${pad(ss)}`;
  $("prog").style.width=(pct*100).toFixed(1)+"%";
  $("pfrom").textContent=f(s.from);$("pto").textContent=f(s.to)+(s.to>=1440?"（明天）":"");
  // 接下来：之后的 3 项
  const x0=nowMins(d),ups=day.rows.filter(r=>r.a>x0).slice(0,3);
  if(ups.length<3&&s.next&&s.next.tomorrow)ups.push({a:s.next.a,n:s.next.n,c:s.next.c,need:true,tomorrow:true});
  $("next").innerHTML=ups.length?ups.map(r=>`<div class="h-uprow${r.need?" need":""}"><span class="h-ut">${r.tomorrow?"明天 ":""}${f(r.a)}</span><span class="h-un">${esc(r.n)}</span><span class="h-ug">${r.need?"学习":catName(r.c).split(" / ")[0]}</span></div>`).join("")
    :`<div class="h-empty">今天没有后续安排</div>`;
  renderActs(s,d);
  // 今日进度
  const rows=day.rows,real=rows.filter(r=>r.d>0);
  const sts=rows.map(r=>rowState(ds,r,d));
  $("dbar").innerHTML=rows.map((r,i)=>r.d>0?`<i style="flex:${r.d};--x:${col(r.c)}" class="st-${sts[i]} ${s.r===r?"on":""}"></i>`:"").join("");
  const needN=rows.filter(r=>r.need).length;
  const checked=sts.filter(x=>x==="done"||x==="partial"||x==="skipped").length,missed=sts.filter(x=>x==="missed").length;
  const pend=sts.filter(x=>x==="pending").length;
  $("ring").innerHTML=ring(checked,needN);
  $("done").innerHTML=`已打卡 ${checked} / ${needN} 项`+(pend?` · <a class="missed-link pend-link" id="pendLink">${pend} 项待结束</a>`:"")+(missed?` · <a class="missed-link" id="missLink">${missed} 项未打卡</a>`:"");
  const pl=$("pendLink");if(pl)pl.onclick=()=>openList(ds);
  const ml=$("missLink");if(ml)ml.onclick=()=>openList(ds);
  $("dmeta").innerHTML=rows.length?`<span>${f(rows[0].a)} 开始</span><span>${f(rows[rows.length-1].b)} 结束</span>`:"";
  $("foot").style.visibility=day.type==="week"?"visible":"hidden";

  // 跨时段时刷新列表
  const key=ds+"|"+s.i+"|"+(s.gapAfter??"")+"|"+sts.join("");
  if(key!==tick.key){tick.key=key;if(isOpen("listWrap"))renderList()}
}

// 主卡打卡区：大的圆形按钮。学习项打两次卡：开始学习、结束学习
function punchActions(ds,d){
  const day=days[ds];if(!day)return [];
  const x=nowMins(d),acts=[];
  day.rows.forEach(r=>{
    if(!r.need)return;
    const ck=r.ck,started=ck&&ck.status==="started",closed=ck&&!started;
    if(closed)return;
    if(x>=r.b-END_BEFORE&&x<=r.b+END_AFTER)acts.push({type:"end",r,started});
    else if(started&&x<r.b-END_BEFORE)acts.push({type:"run",r});
    else if(!ck&&x>=r.a-START_BEFORE&&x<r.b-END_BEFORE)acts.push({type:"start",r});
  });
  if(!acts.length){
    // 当前学习项已经打完卡
    const cur=day.rows.find(r=>r.need&&r.d>0&&x>=r.a&&x<r.b&&r.ck&&r.ck.status!=="started");
    if(cur)acts.push({type:"done",r:cur});
    // 下一个学习项：先显示出来，到时间才能点
    const nx=day.rows.find(r=>r.need&&!r.ck&&r.a-START_BEFORE>x);
    if(nx)acts.push({type:"wait",r:nx});
  }
  const order={end:0,start:1,run:2,done:3,wait:4};
  return acts.sort((p,q)=>order[p.type]-order[q.type]).slice(0,2);
}
// 学习中圆环：已学时间 / 计划时长
function ringOff(r,d){
  const st=new Date(String(r.ck.started).replace(" ","T")),p=Math.min(1,Math.max(0,(d-st)/60000/Math.max(1,r.plan)));
  return (339.3*(1-p)).toFixed(1);
}
function elapsed(ck,d){
  const st=new Date(String(ck.started).replace(" ","T")),sec=Math.max(0,Math.floor((d-st)/1000));
  const h=Math.floor(sec/3600);return `${h?h+":":""}${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`;
}
function renderActs(s,d){
  const el=$("acts"),ds=iso(d),acts=punchActions(ds,d);
  const mode=acts.map(a=>a.type+a.r.id).join("|")+(acts.length===2?"|two":"");
  if(el.dataset.mode===mode){                       // 只刷新计时数字
    el.querySelectorAll("[data-run]").forEach(e=>{const r=days[ds].rows.find(q=>q.id===+e.dataset.run);if(r&&r.ck)e.textContent=elapsed(r.ck,d)});
    el.querySelectorAll("[data-ring]").forEach(e=>{const r=days[ds].rows.find(q=>q.id===+e.dataset.ring);if(r&&r.ck)e.setAttribute("stroke-dashoffset",ringOff(r,d))});
    return;
  }
  let h="";
  acts.forEach(a=>{
    const r=a.r,span=`${f(r.a)}–${f(r.b)} · ${r.plan} 分钟`;
    let main,sub,cls=a.type,hint,da="";
    if(a.type==="start"){main="开始学习";sub=r.n;hint=nowMins(d)<r.a?`${f(r.a)} 开始`:`已迟到 ${Math.floor(nowMins(d)-r.a)} 分钟`;da="start"}
    else if(a.type==="end"){main="结束学习";sub=r.n;hint=`${f(r.b+END_AFTER)} 前打卡`;da="end"}
    else if(a.type==="run"){main=`<span data-run="${r.id}">${elapsed(r.ck,d)}</span>`;sub="学习中";hint=`${f(r.b-END_BEFORE)} 可结束`;da="run"}
    else if(a.type==="done"){const c=r.ck;main=c.status==="skipped"?"已跳过":c.status==="partial"?"部分完成":"已完成";sub=c.status==="skipped"?r.n:c.actual!=null?`${c.actual} 分钟`:r.n;hint="点击可修改";da="edit"}
    else{main="开始学习";sub=r.n;hint=`${f(r.a-START_BEFORE)} 可开始`;da="wait"}
    let deco="";
    if(a.type==="run")deco=`<svg class="pr" viewBox="0 0 120 120"><circle class="pr-bg" cx="60" cy="60" r="54"/><circle class="pr-fg" data-ring="${r.id}" cx="60" cy="60" r="54" stroke-dasharray="339.3" stroke-dashoffset="${ringOff(r,d)}"/></svg>`;
    if(a.type==="done"){const st=r.ck.status;deco=`<span class="pb-ic ${st}">${st==="skipped"?`<svg viewBox="0 0 24 24"><path d="M7 12h10"/></svg>`:`<svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8.5"/></svg>`}</span>`}
    h+=`<div class="pz-item"><button class="pbig p-${cls}" data-a="${da}" data-id="${r.id}">${deco}<span class="pb-main">${main}</span><span class="pb-sub">${esc(sub)}</span></button><div class="pz-hint">${hint}</div></div>`;
  });
  const missed=(days[ds]?.rows||[]).filter(r=>rowState(ds,r,d)==="missed").length;
  const nonStudy=s&&s.i>=0&&!s.r.need;
  el.innerHTML=(h?`<div class="punchzone${acts.length===2?" two":""}">${h}</div>`:"")+
    
    (missed?`<a class="pz-miss" data-a="list">${missed} 项未打卡 · 去补打卡</a>`:"");
  el.dataset.mode=mode;el.style.display=el.innerHTML?"":"none";
}

/* ================================================================
   实时同步：手机、电脑任何一端打卡，另一端立即更新（服务器推送）
   ================================================================ */
let es=null;
function connectEvents(){
  if(!window.EventSource)return;
  if(es&&es.readyState!==2)return;                 // 已连接或正在重连
  try{es&&es.close()}catch(_){}
  es=new EventSource("/api/events");
  es.onmessage=async e=>{
    let m;try{m=JSON.parse(e.data)}catch(_){return}
    await refresh(m.date);
    const t=iso(nowDate());if(m.date!==t&&days[t])refresh(t);
    if(m.by&&m.by!==CLIENT_ID)toast("已同步另一台设备的打卡");
  };
  es.onerror=()=>{if(es.readyState===2)setTimeout(connectEvents,3000)};
}

/* ================================================================

   ================================================================ */
let lockN=0,scrollY0=0;
const isOpen=id=>$(id).classList.contains("show");
function openModal(id){
  if(isOpen(id))return;
  if(lockN++===0){scrollY0=scrollY;document.body.style.top=-scrollY0+"px";document.body.classList.add("lock")}
  $(id).classList.add("show");
}
function closeModal(id){
  if(!isOpen(id))return;
  $(id).classList.remove("show");
  if(--lockN===0){document.body.classList.remove("lock");document.body.style.top="";scrollTo(0,scrollY0)}
}
document.querySelectorAll(".modal").forEach(w=>w.addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeModal(w.id)}));
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  for(const id of ["itemWrap","statsWrap","listWrap"])if(isOpen(id)){closeModal(id);break}
});

let listDate=null;
async function openList(ds){

function shiftList(n){
  const today=parseISO(iso(nowDate())),cur=addDays(parseISO(listDate),n);
  const diff=Math.round((cur-today)/864e5);
  if(diff<-MAX_BACK||diff>MAX_FWD)return;
  openList(iso(cur));
}
$("dPrev").onclick=()=>shiftList(-1);
$("dNext").onclick=()=>shiftList(1);
$("open").onclick=()=>openList();

function renderList(scroll){
  const d=nowDate(),today=iso(d),ds=listDate,day=days[ds];
  const diff=Math.round((parseISO(ds)-parseISO(today))/864e5);
  $("dLabel").innerHTML=`${dayLabel(ds)}<small>${diff===0?"今天":diff===-1?"昨天":diff===1?"明天":diff<0?`${-diff} 天前`:`${diff} 天后`}${day?" · "+(day.type==="end"?"周末":"工作日"):""}</small>`;
  $("dPrev").disabled=diff<=-MAX_BACK;$("dNext").disabled=diff>=MAX_FWD;
  if(!day){$("sum").innerHTML="";$("list").innerHTML=`<div class="empty">加载中…</div>`;return}
  const rows=day.rows;
  if(!rows.length){$("sum").innerHTML="";$("list").innerHTML=`<div class="empty">这一天没有作息安排</div>`;return}
  const sts=rows.map(r=>rowState(ds,r,d));
  const cnt=k=>sts.filter(x=>x===k).length;
  const studyH=rows.filter(r=>r.need).reduce((a,r)=>a+r.d,0)/60;
  if(ds<=today){
    $("sum").innerHTML=`<span class="chip" style="--x:var(--study)">学习 ${rows.filter(r=>r.need).length} 项 · ${Math.round(studyH*10)/10}h</span><span class="chip" style="--x:var(--grey)">完成 ${cnt("done")}</span>`+
      (cnt("partial")?`<span class="chip" style="--x:var(--orange)">部分 ${cnt("partial")}</span>`:"")+
      (cnt("skipped")?`<span class="chip" style="--x:var(--grey)">跳过 ${cnt("skipped")}</span>`:"")+
      (cnt("pending")?`<span class="chip" style="--x:var(--amber)">待打卡 ${cnt("pending")}</span>`:"")+
      (cnt("missed")?`<span class="chip red">未打卡 ${cnt("missed")}</span>`:"")+
      (!day.editable?`<span class="chip" style="--x:var(--grey)">超过 ${MAX_BACK} 天，只能查看</span>`:"");
  }else{
    $("sum").innerHTML=`<span class="chip" style="--x:var(--study)">学习 ${rows.filter(r=>r.need).length} 项 · ${Math.round(studyH*10)/10}h · 需打卡</span><span class="chip" style="--x:var(--rest)">休息等 · 不需要打卡</span>`;
  }
  // 居中目标：今天是进行中 / 接下来的那一项；以前的日子是第一项未打卡
  let tgt=-1;
  if(ds===today){const s=state(d);tgt=s.i>=0?s.i:s.i===-3?s.gapAfter+1:s.i===-2?rows.length-1:0}
  else if(ds<today)tgt=sts.indexOf("missed");
  if(ds===today&&sts.includes("pending"))tgt=sts.lastIndexOf("pending");
  let h="";
  rows.forEach((r,i)=>{
    const p=rows[i-1];
    if(p&&r.a>p.b)h+=`<div class="gap">空档 ${f(p.b)}–${f(r.a)} · ${r.a-p.b} 分钟</div>`;
    const st=sts[i],ck=r.ck;
    const up=ds===today&&i===tgt&&st==="future";
    const SHORT={meal:"用餐",rest:"休息",fun:"娱乐",life:"起居",sleep:"睡眠",plan:"规划",study:"学习"};
    let pill,pk=st;
    if(st==="on")pill="进行中";
    else if(st==="ready")pill="可以开始";
    else if(st==="running")pill="学习中";
    else if(up)pill="接下来",pk="up";
    else if(st==="done")pill=ck.actual!=null?`✓ ${ck.actual} 分钟`:"✓ 完成";
    else if(st==="partial")pill=`${ck.actual}/${r.plan} 分钟`;
    else if(st==="skipped")pill="跳过";
    else if(st==="missed")pill="未打卡";
    else if(st==="pending")pill=ck&&ck.status==="started"?"待结束打卡":"待打卡";
    else if(st==="rest")pill=SHORT[r.c]||"休息";
    else pill=r.need?"需打卡":(SHORT[r.c]||"休息");
    if(ck&&ck.makeup)pill+=" · 补";
    const sub=r.d?`${f(r.a)} – ${f(r.b)} · ${r.d} 分钟`:`${f(r.a)} · 就寝`;
    const cls=`st-${st}${r.need?"":" free"}${["on","ready","running"].includes(st)?" on":""}${up?" up":""}${i===tgt?" target":""}`;
    h+=`<div class="row ${cls}" data-id="${r.id}" style="--x:${col(r.c)}"><div class="tm">${f(r.a)}</div><div class="card"><div class="main"><div class="nm">${esc(r.n)}</div><div class="sub">${sub}</div></div><span class="pill p-${pk}">${pill}</span></div></div>`;
  });
  $("list").innerHTML=h;
  if(scroll)centerTarget();
}
function centerTarget(){
  const L=$("list"),e=L.querySelector(".row.target");
  if(!e){L.scrollTop=0;return}
  const lr=L.getBoundingClientRect(),er=e.getBoundingClientRect();
  L.scrollTop+=(er.top+er.height/2)-(lr.top+lr.height/2);
}
$("list").addEventListener("click",e=>{
  const row=e.target.closest(".row");if(!row)return;
  if(row.classList.contains("free")){toast("非学习时间，不需要打卡");return}
  openItem(listDate,+row.dataset.id);
});

/* ================================================================
   打卡 / 补打卡 / 修改
   ================================================================ */
let item=null;   // {ds, r, status}
function openItem(ds,id,preset){
  const day=days[ds];if(!day)return;
  const r=day.rows.find(x=>x.id===id);if(!r)return;
  item={ds,r,status:preset||(r.ck?r.ck.status:"done")};
  renderItem();openModal("itemWrap");
}
function renderItem(){
  const {ds,r}=item,d=nowDate(),st=rowState(ds,r,d),ck=r.ck,day=days[ds];
  $("iTitle").textContent=st==="missed"?"补打卡":ck&&ck.status!=="started"?"修改打卡":"打卡";
  let h=`<h3>${esc(r.n)}</h3><div class="meta">${dayLabel(ds)} · ${f(r.a)}${r.d?"–"+f(r.b):""}${r.plan?` · 计划 ${r.plan} 分钟`:""}</div>`;
  const startedTxt=ck&&ck.started?`，${String(ck.started).slice(11,16)} 开始`:"";
  h+=`<div class="now">当前状态：<b>${ST[st]||st}</b>${startedTxt}${ck&&ck.actual!=null&&ck.status!=="started"?`，学习 ${ck.actual} 分钟`:""}${ck&&ck.makeup?"（补打卡）":""}${ck&&!ck.makeup&&ck.note?`<br>备注：${esc(ck.note)}`:""}</div>`;
  const undo=ck?`<button class="btn red" data-a="undo">撤销打卡</button>`:"";
  if(!day.editable){
    h+=`<div class="lock-msg">${ds>iso(d)?"还没到这一天，不能打卡":`只能补最近 ${MAX_BACK} 天的打卡`}</div>`;
    $("iBody").innerHTML=h;return;
  }
  if(st==="future"){
    h+=`<div class="lock-msg">还没到时间：${f(r.a-START_BEFORE)} 起可以在主页面点“开始学习”</div>`;
    $("iBody").innerHTML=h;return;
  }
  if(inLive(ds,r,d)){
    // 打卡时间内：开始、结束用主页面的大按钮；这里只能跳过或撤销
    h+=`<div class="lock-msg">请在主页面用圆形按钮${!ck?"开始学习":ck.status==="started"?`结束学习（${f(r.b-END_BEFORE)}–${f(r.b+END_AFTER)}）`:"操作"}<br><small>不打算做这一项，可以选择跳过</small></div>`;
    h+=`<div class="irow">${undo}${!ck||ck.status==="started"?`<button class="btn plain" data-a="skipnow">跳过这一项</button>`:""}</div>`;
    $("iBody").innerHTML=h;return;
  }
  // 打卡时间已过：补打卡 / 修改
  const s=item.status==="started"?"done":item.status;
  item.status=s;
  h+=`<div class="seg">${["done","partial","skipped"].map(k=>`<button data-s="${k}" class="${s===k?"on":""}">${{done:"完成",partial:"部分完成",skipped:"跳过"}[k]}</button>`).join("")}</div>`;
  if(s!=="skipped"&&r.plan>0){
    const v=ck&&ck.actual!=null?ck.actual:(s==="partial"?Math.round(r.plan/2):"");
    h+=`<label class="fld">实际用时（分钟）${s==="done"?"，不填按计划 "+r.plan+" 分钟":"，必填"}<input id="iMin" type="number" inputmode="numeric" min="0" max="1440" value="${v}" placeholder="${r.plan}"></label>`;
  }
  const makeup=ck&&ck.status!=="started"?ck.makeup:true;   // 补打卡不填备注
  if(!makeup)h+=`<label class="fld">${s==="skipped"?"跳过原因":"备注"}（可不填）<textarea id="iNote" rows="2" maxlength="500" placeholder="${s==="skipped"?"比如：临时开会":"比如：复盘内容、状态"}">${esc(ck?ck.note:"")}</textarea></label>`;
  if(makeup&&!(ck&&ck.makeup))h+=`<div class="hint">已过了打卡时间，会记为补打卡</div>`;
  h+=`<div class="irow">${undo}<button class="btn c" style="background:#3d6be0" data-a="save">${ck&&ck.status!=="started"?"保存修改":"补打卡"}</button></div>`;
  $("iBody").innerHTML=h;
}
$("iBody").addEventListener("click",async e=>{
  const sb=e.target.closest("[data-s]");
  if(sb){
    const min=$("iMin"),note=$("iNote");
    const keep={min:min?min.value:null,note:note?note.value:""};
    item.status=sb.dataset.s;renderItem();
    if($("iNote"))$("iNote").value=keep.note;
    if($("iMin")&&keep.min!==null&&keep.min!=="")$("iMin").value=keep.min;
    return;
  }
  const b=e.target.closest("[data-a]");if(!b)return;
  const {ds,r}=item;
  if(b.dataset.a==="undo"){
    if(!confirm(`撤销「${r.n}」的打卡？`))return;
    b.disabled=true;
    try{await api(`/checkin?date=${ds}&schedule_id=${r.id}`,{method:"DELETE"});closeModal("itemWrap");await refresh(ds);toast("已撤销")}
    catch(err){toast(err.message,true);b.disabled=false}
    return;
  }
  if(b.dataset.a==="skipnow"){
    b.disabled=true;
    try{await api("/checkin",{method:"PUT",body:JSON.stringify({date:ds,schedule_id:r.id,status:"skipped"})});closeModal("itemWrap");await refresh(ds);toast(`已跳过「${r.n}」`)}
    catch(err){toast(err.message,true);b.disabled=false}
    return;
  }
  if(b.dataset.a==="save"){
    const body={date:ds,schedule_id:r.id,status:item.status};
    const mi=$("iMin"),no=$("iNote");
    if(mi&&mi.value!==""){const v=parseInt(mi.value,10);if(isNaN(v)||v<0||v>1440){toast("实际用时应在 0–1440 分钟之间",true);return}body.actual_min=v}
    if(item.status==="partial"&&body.actual_min==null){toast("部分完成需要填写实际用时",true);mi&&mi.focus();return}
    if(no&&no.value.trim())body.note=no.value.trim();
    b.disabled=true;
    try{
      const res=await api("/checkin",{method:"PUT",body:JSON.stringify(body)});
      closeModal("itemWrap");await refresh(ds);
      toast(`「${r.n}」${ST[res.status]}${res.is_makeup?"（补打卡）":""}`);
    }catch(err){toast(err.message,true);b.disabled=false}
  }
});

function renderStats(j){

  const w=j.weekly.find(x=>x.week_start===thisMonday)||{};
  let h=`<div class="tiles">
    <div class="tile"><div class="k">本周学习打卡率</div><div class="v">${pct(w.completion_rate)}</div><div class="s">完成 ${w.done_items||0} / ${w.planned_items||0} 项</div></div>
    <div class="tile"><div class="k">本周学习完成率</div><div class="v">${pct(w.study_rate)}</div><div class="s">实际 ${w.study_actual_hours??0} / 计划 ${w.study_planned_hours??0} 小时</div></div>
    <div class="tile"><div class="k">本周未打卡</div><div class="v" style="color:var(--red)">${w.missed_items||0}<small>项</small></div><div class="s">跳过 ${w.skipped_items||0} 项</div></div>
    <div class="tile"><div class="k">本周补打卡</div><div class="v">${w.makeup_items||0}<small>项</small></div><div class="s">部分完成 ${w.partial_items||0} 项</div></div>
  </div>
`;
  // 图表：柱状（学习小时）+ 折线（学习完成率）
  h+=`<div class="h4 chart-head"><span>学习趋势</span><span class="seg mini" id="cMode"><button data-m="day" class="${chart.mode==="day"?"on":""}">每天</button><button data-m="week" class="${chart.mode==="week"?"on":""}">每周</button></span></div>
    <div class="blist chartbox"><div class="cnav" id="cNav"></div><div id="cSvg"></div>
    <div class="legend"><span><i class="lg-plan"></i>计划学习小时</span><span><i class="lg-act"></i>实际学习小时</span><span><i class="lg-line"></i>学习完成率</span></div>
    <div class="cdetail" id="cDetail"></div></div>`;
  // 近 7 天
  h+=`<div class="h4">近 7 天</div><div class="blist">`;
  if(!j.daily.length)h+=`<div class="empty">暂无数据</div>`;
  [...j.daily].slice(-7).reverse().forEach(x=>{
    const dd=parseISO(x.plan_date);
    h+=`<div class="bl"><div class="lb"><b>${dd.getMonth()+1}/${dd.getDate()}</b> 周${W[dd.getDay()]}</div>
      <div class="tr"><i style="width:${Math.min(100,x.completion_rate||0)}%;--x:var(--study)"></i></div><div class="vv">${pct(x.completion_rate)}</div>
      <div class="sub2">学习 ${hrs(x.study_actual_min)} / ${hrs(x.study_planned_min)} 小时（${pct(x.study_rate)}）· 未打卡 ${x.missed_items} 项</div></div>`;
  });
  h+=`</div>`;
  // 本周各类别
  const tasks=(j.week_tasks||[]).filter(t=>t.planned_min>0);
  if(tasks.length){
    h+=`<div class="h4">本周各学习事项（实际 / 计划）</div><div class="blist">`;
    tasks.forEach(t=>{
      const p=Math.min(100,100*(t.actual_min||0)/t.planned_min);
      h+=`<div class="bl"><div class="lb"><b>${esc(t.task)}</b></div>
        <div class="tr"><i style="width:${p}%;--x:var(--study)"></i></div><div class="vv">${Math.round(p)}%</div>
        <div class="sub2">${hrs(t.actual_min)} / ${hrs(t.planned_min)} 小时 · 打卡 ${t.checked} / ${t.planned_items} 次</div></div>`;
    });
    h+=`</div>`;
  }
  // 最近几周
  if(j.weekly.length){
    h+=`<div class="h4">最近几周</div><div class="blist"><table class="wtab"><tr><th>周</th><th>打卡率</th><th>学习完成率</th><th>学习小时</th><th>未打卡</th></tr>`;
    j.weekly.forEach(x=>{h+=`<tr><td>${x.week_start.slice(5)}–${x.week_end.slice(5)}</td><td>${pct(x.completion_rate)}</td><td>${pct(x.study_rate)}</td><td>${x.study_actual_hours}/${x.study_planned_hours}</td><td>${x.missed_items}</td></tr>`});
    h+=`</table></div>`;
  }
  $("stats").innerHTML=h;
  chart.data=j;drawChart();
  $("cMode").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;chart.mode=b.dataset.m;chart.sel=null;
    $("cMode").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));drawChart()};
}

/* ---------------- 学习趋势图（SVG：柱状 + 折线，双坐标轴） ---------------- */
const chart={mode:"day",week:0,sel:null,data:null};
function chartSeries(){
  const j=chart.data;
  if(chart.mode==="week"){
    const ws=[...j.weekly].reverse();      // 旧 → 新
    return {title:`最近 ${ws.length} 周`,pts:ws.map(w=>({
      lb:w.week_start.slice(5).replace("-","/"),sub:"",plan:w.study_planned_hours||0,act:w.study_actual_hours||0,
      rate:w.study_rate,detail:`${w.week_start.slice(5)}–${w.week_end.slice(5)} · 学习 ${w.study_actual_hours} / ${w.study_planned_hours} 小时 · 学习完成率 ${pct(w.study_rate)} · 打卡率 ${pct(w.completion_rate)} · 未打卡 ${w.missed_items} 项`}))};
  }
  // 每天：显示某一周的周一到周日
  const monday=addDays(nowDate(),-((nowDate().getDay()+6)%7)-7*chart.week);
  const byDate={};j.daily.forEach(x=>byDate[x.plan_date]=x);
  const pts=[];
  for(let i=0;i<7;i++){
    const dd=addDays(monday,i),k=iso(dd),x=byDate[k];
    pts.push({lb:"一二三四五六日"[i],sub:`${dd.getMonth()+1}/${dd.getDate()}`,
      plan:x?(x.study_planned_min||0)/60:null,act:x?(x.study_actual_min||0)/60:null,rate:x?x.study_rate:null,
      detail:x?`${dd.getMonth()+1}月${dd.getDate()}日 周${"一二三四五六日"[i]} · 学习 ${hrs(x.study_actual_min)} / ${hrs(x.study_planned_min)} 小时 · 学习完成率 ${pct(x.study_rate)} · 打卡率 ${pct(x.completion_rate)} · 未打卡 ${x.missed_items} 项`
        :`${dd.getMonth()+1}月${dd.getDate()}日 · 没有数据`});
  }
  const sun=addDays(monday,6);
  return {title:`${monday.getMonth()+1}/${monday.getDate()} – ${sun.getMonth()+1}/${sun.getDate()}${chart.week===0?"（本周）":""}`,pts};
}
function drawChart(){
  if(!chart.data)return;
  const {title,pts}=chartSeries();
  // 周导航（每天模式）
  const maxBack=Math.max(0,Math.ceil((parseISO(iso(nowDate()))-parseISO(chart.data.daily[0]?.plan_date||iso(nowDate())))/864e5/7));
  $("cNav").innerHTML=chart.mode==="day"
    ?`<button data-w="1" ${chart.week>=maxBack?"disabled":""}>‹</button><span>${title}</span><button data-w="-1" ${chart.week<=0?"disabled":""}>›</button>`
    :`<span>${title}</span>`;
  $("cNav").onclick=e=>{const b=e.target.closest("[data-w]");if(!b||b.disabled)return;chart.week+=+b.dataset.w;chart.sel=null;drawChart()};
  const W=360,H=210,L=34,Rr=36,T=14,B=38,iw=W-L-Rr,ih=H-T-B,n=pts.length,bw=iw/n;
  const maxH=Math.max(1,...pts.map(p=>Math.max(p.plan||0,p.act||0)));
  const top=Math.ceil(maxH/2)*2||2;
  const y=v=>T+ih-(v/top)*ih, yr=v=>T+ih-(Math.min(v,100)/100)*ih;
  let g="";
  // 网格与坐标
  for(let k=0;k<=4;k++){const v=top*k/4,yy=y(v);
    g+=`<line x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-6}" y="${yy+4}" class="ax" text-anchor="end">${Math.round(v*10)/10}</text><text x="${W-Rr+6}" y="${yy+4}" class="ax">${25*k}%</text>`}
  g+=`<text x="${L-6}" y="${T-4}" class="ax" text-anchor="end">小时</text>`;
  pts.forEach((p,i)=>{
    const cx=L+bw*i+bw/2,w=Math.min(26,bw*.56);
    if(p.plan!=null)g+=`<rect x="${cx-w/2}" y="${y(p.plan)}" width="${w}" height="${T+ih-y(p.plan)}" rx="5" class="bp"/>`;
    if(p.act)g+=`<rect x="${cx-w/2}" y="${y(p.act)}" width="${w}" height="${T+ih-y(p.act)}" rx="5" class="ba"/>`;
    g+=`<text x="${cx}" y="${H-B+16}" class="xl" text-anchor="middle">${p.lb}</text>`;
    if(p.sub)g+=`<text x="${cx}" y="${H-B+30}" class="xs" text-anchor="middle">${p.sub}</text>`;
    g+=`<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${ih+B}" class="hit${chart.sel===i?" sel":""}" data-i="${i}"/>`;
  });
  // 折线：学习完成率
  const lp=pts.map((p,i)=>p.rate==null?null:[L+bw*i+bw/2,yr(p.rate)]);
  let path="",pen=false;lp.forEach(q=>{if(!q){pen=false;return}path+=(pen?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);pen=true});
  if(path)g+=`<path d="${path}" class="ln"/>`;
  lp.forEach(q=>{if(q)g+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" class="dt"/>`});
  $("cSvg").innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="combo" role="img" aria-label="学习趋势">${g}</svg>`;
  $("cDetail").textContent=chart.sel!=null?pts[chart.sel].detail:"";
  $("cSvg").onclick=e=>{const r=e.target.closest(".hit");if(!r)return;chart.sel=+r.dataset.i;drawChart()};
}

/* ================================================================
   提示条
   ================================================================ */
let toastT=0;
function toast(msg,err){
  const t=$("toast");t.textContent=msg;t.classList.toggle("err",!!err);t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),err?3600:2200);
}

/* ================================================================
   启动与定时刷新
   ================================================================ */
let lastDay=null;
async function syncData(){
  try{const c=await api("/config");TZOFF=c.utc_offset_min}catch(_){}
  await loadAround();
  lastDay=iso(nowDate());
  $("acts").dataset.mode="";tick.key="";tick();
}
setInterval(()=>{
  tick();
  if(iso(nowDate())!==lastDay)syncData();      // 过了零点，重新读取
},1000);
setInterval(syncData,60000);                    // 每分钟同步一次（其他设备打的卡也能看到）
document.addEventListener("visibilitychange",()=>{if(!document.hidden){syncData();connectEvents()}});
connectEvents();
try{localStorage.removeItem("routine.timer")}catch(_){}

/* ================================================================
   在线更新：服务器发现 GitHub 上有新版本时提示，点“立即更新”自动下载并重启
   ================================================================ */
let upd=null;
const UKEY="routine.skipUpdate";
async function checkUpdate(force){
  try{
    const v=await api("/version");$("ver").textContent=(v.release?v.release+" · ":"版本 ")+v.version;
    upd=await api(`/update/check${force?"?force=true":""}`);
  }catch(_){return}
  let skip=null;try{skip=localStorage.getItem(UKEY)}catch(_){}
  const el=$("upd");
  if(!upd.available||(!force&&skip===upd.latest)){el.hidden=true;return}
  const list=upd.changes.slice(0,5).map(c=>`<li>${esc(c.replace(/^\S+\s/,""))}</li>`).join("");
  el.innerHTML=`<div class="u-main"><b>发现新版本${upd.latest_release?" "+esc(upd.latest_release):""}</b><span>${upd.behind} 项更新 · ${esc(upd.release||upd.current)} → ${esc(upd.latest_release||upd.latest)}</span></div>
    <ul class="u-list">${list}${upd.changes.length>5?`<li>……</li>`:""}</ul>
    <div class="u-btns"><button class="u-later" data-u="later">稍后</button><button class="u-go" data-u="go">立即更新</button></div>`;
  el.hidden=false;
}
$("upd").addEventListener("click",async e=>{
  const b=e.target.closest("[data-u]");if(!b)return;
  if(b.dataset.u==="later"){try{localStorage.setItem(UKEY,upd.latest)}catch(_){}$("upd").hidden=true;return}
  if(!confirm(`更新到 ${upd.latest_release||upd.latest}？\n\n更新时后端会重启，大约需要半分钟，期间页面暂时不能打卡。打卡记录不会受影响。`))return;
  const from=upd.current;
  try{await api("/update/apply",{method:"POST"})}catch(err){toast(err.message,true);return}
  $("upd").innerHTML=`<div class="u-main"><b>正在更新…</b><span>下载新版本并重启后端，完成后页面会自动刷新</span></div>`;
  const t0=Date.now();
  const poll=async()=>{
    try{const v=await api("/version");if(v.version!==from){toast("更新完成");setTimeout(()=>location.reload(),800);return}}catch(_){}
    if(Date.now()-t0>180000){$("upd").innerHTML=`<div class="u-main"><b>更新似乎没有完成</b><span>请查看服务器上的 logs/update.log</span></div>`;return}
    setTimeout(poll,2000);
  };
  setTimeout(poll,3000);
});
checkUpdate();
setInterval(()=>checkUpdate(),30*60000);
syncData();
</script>
